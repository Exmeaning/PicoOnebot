# 打 tag(v1.2.3 或 v0.20) 触发 GitHub Actions 自动构建 WebUI 与混合 APK 并发布 GitHub Release。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version override (e.g. 0.5.0)'
        required: false
        default: ''

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      should_publish: ${{ steps.ver.outputs.should_publish }}
      is_prerelease: ${{ steps.ver.outputs.is_prerelease }}
      publish_latest: ${{ steps.ver.outputs.publish_latest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve and validate version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          is_ci_build="false"
          if [ -n "$INPUT_VERSION" ]; then
            raw="$INPUT_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            raw="$REF_NAME"
          else
            raw="0.0.0-ci.${COMMIT_SHA:0:7}"
            is_ci_build="true"
          fi

          # 拒绝换行/控制字符，防止 $GITHUB_OUTPUT 注入与 Shell 命令注入
          case "$raw" in
            *$'\n'*|*$'\r'*)
              echo "Invalid version (contains newline): $raw" >&2
              exit 1
              ;;
          esac

          # 严格校验版本号（兼容历史 v0.19 及标准 SemVer v1.2.3 / 1.2.3-rc.1，禁止 .. 与任意 Shell 元字符）
          semver_re='^v?[0-9]+\.[0-9]+(\.[0-9]+)?([-.][0-9A-Za-z]+)*$'
          if [[ ! "$raw" =~ $semver_re ]]; then
            echo "Invalid version format: '$raw' (expected SemVer like 0.20 or 1.2.3-rc.1)" >&2
            exit 1
          fi

          v="${raw#v}"
          if [[ "$v" == *-* ]]; then
            is_prerelease="true"
          else
            is_prerelease="false"
          fi

          # 留空 version 的 workflow_dispatch (0.0.0-ci.*) 仅产出构建产物，不公开发布 Release 或推送镜像；
          # 预发布版本 (-rc/-beta 等) 标记为 prerelease 且不覆盖 GHCR :latest 标签。
          if [ "$is_ci_build" = "false" ] && { [ "$REF_TYPE" = "tag" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; }; then
            should_publish="true"
          else
            should_publish="false"
          fi

          if [ "$should_publish" = "true" ] && [ "$is_prerelease" = "false" ]; then
            publish_latest="true"
          else
            publish_latest="false"
          fi

          printf 'version=%s\n' "$v" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$v" >> "$GITHUB_OUTPUT"
          printf 'should_publish=%s\n' "$should_publish" >> "$GITHUB_OUTPUT"
          printf 'is_prerelease=%s\n' "$is_prerelease" >> "$GITHUB_OUTPUT"
          printf 'publish_latest=%s\n' "$publish_latest" >> "$GITHUB_OUTPUT"

      # ---- WebUI(单文件产物,之后作为 asset 注入 APK)----
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Type-check and build WebUI
        working-directory: web
        env:
          PICO_VERSION: ${{ steps.ver.outputs.version }}
        run: npm ci && npm run build

      # ---- 宿主 APK 与编译期依赖 ----
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Install dex2jar (SHA-256 verified)
        env:
          DEX2JAR_URL: https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip
          DEX2JAR_SHA256: ee7c45eb3c1d2474a6145d8d447e651a736a22d9664b6d3d3be5a5a817dda23a
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/dex-tools.zip" "$DEX2JAR_URL"
          printf '%s  %s\n' "$DEX2JAR_SHA256" "$RUNNER_TEMP/dex-tools.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/dex-tools.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/dex-tools-v2.4/"*.sh
          printf '%s\n' "$RUNNER_TEMP/dex-tools-v2.4" >> "$GITHUB_PATH"

      - name: Fetch base apk + gen source.jar
        env:
          PICO_BASE_APK_URL: ${{ secrets.PICO_BASE_APK_URL || vars.PICO_BASE_APK_URL }}
          PICO_BASE_APK_SHA256: ${{ secrets.PICO_BASE_APK_SHA256 || vars.PICO_BASE_APK_SHA256 }}
        run: |
          set -euo pipefail
          chmod +x scripts/fetch-base.sh gradlew
          bash scripts/fetch-base.sh

      - name: Run buildtools and Android unit tests
        run: ./gradlew :apkmixin:test :app:testDebugUnitTest --no-daemon

      # ---- 可选自定义签名密钥（未配置 Secrets 时保持默认 testkey.pk8 以兼容原地升级）----
      - name: Configure optional release signing key
        env:
          PICO_SIGN_KEY_B64: ${{ secrets.PICO_SIGN_KEY_B64 }}
          PICO_SIGN_CERT_B64: ${{ secrets.PICO_SIGN_CERT_B64 }}
        run: |
          set -euo pipefail
          if [ -n "$PICO_SIGN_KEY_B64" ] && [ -n "$PICO_SIGN_CERT_B64" ]; then
            umask 077
            mkdir -p "$RUNNER_TEMP/pico-sign"
            printf '%s' "$PICO_SIGN_KEY_B64" | base64 -d > "$RUNNER_TEMP/pico-sign/release.pk8"
            printf '%s' "$PICO_SIGN_CERT_B64" | base64 -d > "$RUNNER_TEMP/pico-sign/release.x509.pem"
            printf 'PICO_SIGN_KEY=%s\n' "$RUNNER_TEMP/pico-sign/release.pk8" >> "$GITHUB_ENV"
            printf 'PICO_SIGN_CERT=%s\n' "$RUNNER_TEMP/pico-sign/release.x509.pem" >> "$GITHUB_ENV"
            echo "Using custom release signing key from repository secrets."
          elif [ -n "$PICO_SIGN_KEY_B64" ] || [ -n "$PICO_SIGN_CERT_B64" ]; then
            echo "ERROR: Both PICO_SIGN_KEY_B64 and PICO_SIGN_CERT_B64 must be set together." >&2
            exit 1
          else
            echo "PICO_SIGN_KEY_B64/PICO_SIGN_CERT_B64 not set; falling back to default app/mixin/testkey.pk8."
          fi

      # ---- 混合 APK 构建 ----
      - name: Build Mixin APK
        env:
          PICO_VERSION: ${{ steps.ver.outputs.version }}
        run: ./gradlew MixinApk-release --no-daemon "-PpicoVersion=$PICO_VERSION"

      - name: Clean up signing key material
        if: always()
        run: rm -rf "$RUNNER_TEMP/pico-sign"

      - name: Generate Checksums
        run: |
          set -euo pipefail
          cd app/dist
          sha256sum PicoOnebot_*.apk > sha256sums.txt
          cat sha256sums.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PicoOnebot-${{ steps.ver.outputs.version }}
          path: |
            app/dist/PicoOnebot_*.apk
            app/dist/sha256sums.txt

  release:
    needs: build
    if: needs.build.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PicoOnebot-${{ needs.build.outputs.version }}
          path: app/dist

      - name: Verify APK Checksums
        run: |
          set -euo pipefail
          cd app/dist
          sha256sum -c sha256sums.txt

      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: PicoOnebot ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.build.outputs.is_prerelease == 'true' }}
          files: |
            app/dist/PicoOnebot_*.apk
            app/dist/sha256sums.txt
          generate_release_notes: true

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PicoOnebot-${{ needs.build.outputs.version }}
          path: app/dist

      # ---- Docker 镜像构建并推送到 GHCR ----
      - name: Prepare Docker Build
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          (cd app/dist && sha256sum -c sha256sums.txt)
          apks=(app/dist/PicoOnebot_*.apk)
          if [ "${#apks[@]}" -ne 1 ] || [ ! -f "${apks[0]}" ]; then
            echo "Expected exactly one APK in app/dist, found ${#apks[@]}" >&2
            exit 1
          fi
          cp "${apks[0]}" docker/PicoOnebot.apk
          REPO_LOWER="$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          printf 'IMAGE_NAME=ghcr.io/%s/pico-onebot\n' "$REPO_LOWER" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: needs.build.outputs.should_publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ needs.build.outputs.publish_latest == 'true' }}
            type=raw,value=${{ needs.build.outputs.version }}
            type=raw,value=${{ needs.build.outputs.tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.build.outputs.should_publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
