name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webui:
    name: WebUI Type-check & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type-check and build WebUI
        working-directory: web
        run: npm run build

  buildtools:
    name: Buildtools Unit Tests & Compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Test apkmixin and compile buildtools
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :apkmixin:test :apkmixin:jar :gen-dep:compileKotlin --no-daemon

  scripts-and-lint:
    name: Scripts, ShellCheck, Unit Tests & YAML Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Shell syntax check (sh -n / bash -n)
        run: |
          set -euo pipefail
          for f in docker/*.sh; do
            sh -n "$f"
          done
          for f in docker/scripts/*.sh scripts/*.sh; do
            bash -n "$f"
          done

      - name: ShellCheck
        run: |
          set -euo pipefail
          shellcheck -s sh -S warning -e SC2034 docker/*.sh
          shellcheck -S warning -e SC2034,SC2155 docker/scripts/*.sh scripts/*.sh

      - name: Ensure PyYAML is available
        run: |
          set -euo pipefail
          if ! python3 -c "import yaml" 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3-yaml
          fi

      - name: Run Python and shell-filter test suite
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v

      - name: Validate YAML manifests and workflows
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          files = sorted([
              *Path(".github").rglob("*.yml"),
              *Path(".github").rglob("*.yaml"),
              *Path("docker").glob("*.yml"),
              *Path("docker").glob("*.yaml"),
          ])
          assert files, "No YAML files found"
          for path in files:
              docs = list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
              assert any(d is not None for d in docs), f"Empty YAML: {path}"
              print(f"OK {path} ({len(docs)} doc(s))")
          PY
